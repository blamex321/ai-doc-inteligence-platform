spring:
  application:
    name: document-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:27017/document_db}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        register: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 8082

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8083/ai/analyze}

storage:
  upload-dir: ${UPLOAD_DIR:}

management:
  endpoints:
    web:
      exposure:
        include: health,info