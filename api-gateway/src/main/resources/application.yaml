spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        register: true
        health-check-path: /actuator/health
        health-check-interval: 10s

    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/auth/**

        - id: document-service
          uri: ${DOCUMENT_SERVICE_URI:lb://document-service}
          predicates:
            - Path=/documents/**

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-which-is-at-least-32-characters-long}
  expiration: 86400000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO